            padding: 15px;

            min-height: 180px;

        .project-icon {
            font-size: 1.5rem;
            opacity: 0.8;
            margin-bottom: 10px;
        }
        
        .project-title {
            font-size: 1rem;
            font-weight: 500;
            color: #333;
            margin: 0 0 15px 0;
        }
        
        .project-description {
            font-size: 0.85rem;
            color: #888;

            text-align: left;
            padding: 0 10px;
        }
        
        .project-link {
            text-decoration: none;
            display: inline-block;
        }
        
        /* 项目菜单按钮样式 - 修改为垂直居中布局 */

            flex-direction: column;
            gap: 8px;
            width: 100%;
            align-items: center;
        }

        /* 响应式设计 */

                align-items: center;
            }

            }
            
            .project-list {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
        
        /* 底部版权样式 - 自适应设计 */
        .footer {
            position: relative;
            margin-top: 60px;
            text-align: center;
            font-size: 0.85rem;
            color: #888;
            width: 100%;
        }
        
        .footer-content {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.85rem;
        }
        
        .footer-divider {
            color: #888;
            margin: 0 5px;
            display: inline-block;
            font-weight: bold;
        }
        
        /* 响应式设计 - 底部版权 */
        @media (max-width: 768px) {
            .footer-content {
                flex-direction: column;
                gap: 10px;
            }
        }
        
        .footer-links {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .footer-link {
            color: #6c757d;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .footer-link:hover {
            color: #007bff;
        }
        
        .footer-divider {
            color: #dee2e6;
        }
        
        /* 响应式设计 - 底部版权 */
        @media (max-width: 768px) {
            .footer {
                padding: 20px 0;
            }
        }

        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0,0,0);
            background-color: rgba(0,0,0,0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 0;
            border: 1px solid #888;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2), 0 6px 20px 0 rgba(0,0,0,0.19);
            display: flex;

        .modal-header {
            padding: 15px 20px;
            background-color: #f8f9fa;

            border-radius: 8px 8px 0 0;
            display: flex;

            align-items: center;
        }

        .modal-header h3 {

        }

        .close-modal {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-modal:hover,
        .close-modal:focus {

            text-decoration: none;

        }

        .modal-body {

            overflow-y: auto;
            flex: 1;
        }

        /* 响应式设计 - 弹窗 */
        @media (max-width: 768px) {
            .modal-content {
                margin: 10% auto;
                width: 95%;
                max-height: 85vh;
            }
        }
        
        /* 响应式设计 - 底部版权 */
        @media (max-width: 768px) {
            .footer-links {
                flex-direction: column;
                gap: 5px;
            }
            
            .footer-divider {
                display: none;
            }
        }
        

    </style>
</head>
<body>

    <!-- 留言弹窗 -->
    <div id="commentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>留言审核后通过~</h3>
                <span class="close-modal">&times;</span>

                <div id="waline-container"></div>

        </div>

    <!-- 网站运行时间计算器 -->
    <script>
        // 网站开始运行时间：2025年10月1日
        const launchDate = new Date(2025, 9, 1); // 月份是从0开始的，所以10月是9
        
        function updateSiteAge() {
            const now = new Date();
            const diff = now - launchDate;
            
            const seconds = Math.floor(diff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);
            
            const remainingHours = hours % 24;
            const remainingMinutes = minutes % 60;
            const remainingSeconds = seconds % 60;
            
            document.getElementById('siteAge').textContent = 
                `${days}天${remainingHours}小时${remainingMinutes}分钟${remainingSeconds}秒`;
        }
        
        // 初始更新
        updateSiteAge();
        
        // 每秒更新一次
        setInterval(updateSiteAge, 1000);
    </script>
    
    <!-- 留言弹窗功能 -->
    <script>
        // 获取弹窗元素
        const modal = document.getElementById('commentModal');
        const openBtn = document.getElementById('openCommentModal');
        const closeBtn = document.getElementsByClassName('close-modal')[0];
        const walineContainer = document.getElementById('waline-container');
        
        // 打开弹窗
        openBtn.onclick = function(e) {
            e.preventDefault();
            modal.style.display = 'block';
            
            // 清空容器内容
            walineContainer.innerHTML = '';
            
            // 创建iframe指向https://comment.ongwu.cn/
            const iframe = document.createElement('iframe');
            iframe.src = 'https://comment.ongwu.cn/';
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.border = 'none';
            iframe.style.minHeight = '700px';
            iframe.title = '评论系统';
            
            // 添加iframe到容器
            walineContainer.appendChild(iframe);
        }
        
        // 关闭弹窗
        closeBtn.onclick = function() {
            modal.style.display = 'none';
        }
        
        // 点击弹窗外部区域关闭弹窗
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }
        
        // 按ESC键关闭弹窗
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && modal.style.display === 'block') {
                modal.style.display = 'none';
            }
        });
    </script>
